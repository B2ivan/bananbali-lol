        :root {
            --bg-pattern-tint: #1c152a;
            --indigo-border: #f2f7f7;
            --panel-fill: #d5dddd;
            --orange-primary: #ed6a22;
        }

        body {
            background: linear-gradient(135deg, var(--bg-pattern-tint), var(--orange-primary));
            background-attachment: fixed;
            font-family: sans-serif;
            text-align: center;
            padding-top: 16px;
        }

        .header-box {
            border: 3px solid var(--indigo-border);
            border-radius: 8px;
            background-color: var(--panel-fill);
            width: fit-content;
            max-width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
        }

        .header-box img {
            display: block;
            width: 480px;
            max-width: calc(100vw - 38px);
            height: auto;
        }

        .main-content {
            border: 3px solid var(--indigo-border);
            border-radius: 8px;
            background-color: var(--panel-fill);

            flex: 1;

            padding: 8px;
            margin: 0 auto;
            align-items: flex-start;
        }

        .main-content .custom-button {
            background: hsl(0deg 0% 75%);
            border: none;
            box-shadow:
                inset -1px -1px #292929,
                inset 1px 1px #fff,
                inset -2px -2px rgb(158, 158, 158),
                inset 2px 2px #fff;
            cursor: pointer;
            display: inline-block;
            font-family: inherit;
            font-size: 14px;
            letter-spacing: 2px;
            outline: 1px dotted rgb(37, 37, 37);
            outline-offset: -4px;
            padding: 5px 30px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .main-content .custom-button:active {
            box-shadow:
                inset -1px -1px #fff,
                inset 1px 1px #292929,
                inset -2px -2px #fff,
                inset 2px 2px rgb(158, 158, 158);
        }

        .container {
            align-items: flex-start;
            display: flex;
            gap: 24px;
            margin: 24px auto;
            max-width: 900px;
            padding: 0 12px;
        }

        .sidebar {
            border: 3px solid var(--indigo-border);
            border-radius: 8px;
            background-color: var(--panel-fill);
            box-sizing: border-box;
            display: flex;
            flex: 0 0 auto;
            flex-direction: column;
            gap: 8px;
            padding: 8px;
        }

        h1 { color: #ff9800; }
